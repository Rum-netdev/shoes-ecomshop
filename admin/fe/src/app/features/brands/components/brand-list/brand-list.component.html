<ng-content *ngIf="isOpenModal">
    <div class="modal" id="upsertModal" #upsertModal>
        <div class="modal-dialog" role="document">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title text-white">{{ modalTitle }}</h5>
              <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close" (click)="closeModal()">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-content">
                <form class="px-3" id="brandForm">
                    <div class="form-group">
                        <label for="brandNameInput" class="font-weight-bold">Id</label>
                        <input type="text" class="form-control" [(ngModel)]="currentBrand.id" name="brandId" id="brandIdInput" value="0" disabled="true">
                    </div>
                    <div class="form-group">
                        <label for="brandNameInput" class="font-weight-bold">Brand Name</label>
                        <input type="text" class="form-control" [(ngModel)]="currentBrand.name" name="brandName" id="brandNameInput" placeholder="Enter brand name..."
                            data-val="true"
                            data-val-required="Please enter new brand name">
                        <span (data-valmsg-for)="currentBrand.name" data-valmsg-replace="true"></span>
                    </div>
                    <div class="form-group">
                        <label for="descriptionTextArea" class="font-weight-bold">Description</label>
                        <textarea class="form-control" id="descriptionTextArea" [(ngModel)]="currentBrand.description" name="brandDescription" rows="3" placeholder="Enter description..."
                            data-val="true"
                            data-val-required="Please enter the description"></textarea>
                        <span (data-valmsg-for)="currentBrand.description" data-valmsg-replace="true"></span>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary text-white" (click)="closeModal()">Cancel</button>
                <div *ngIf="currentBrand.id == 0; then createButton else editButton"></div>
                <ng-template #createButton><button class="btn btn-primary text-white" (click)="createBrand()">Submit</button></ng-template>
                <ng-template #editButton><button class="btn btn-secondary text-white" (click)="updateBrand()">Submit</button></ng-template>
            </div>
          </div>
        </div>
    </div>
      
    <div class="modal-backdrop" (click)="closeModal()"></div>
</ng-content>
